# Local Supabase CLI project. Production email confirmation should remain enabled.
project_id = "mapletally"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "500MiB"
